<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 · MINIMAL</title>
<link rel="stylesheet" href="/login.css">
</head>
<body>

<header>
  <a href="/index.html" class="logo">MINIMAL</a>
  <a href="/index.html" style="font-size:13px; color:#999;">← 쇼핑 계속하기</a>
</header>

<div class="auth-wrap">
  <div class="auth-box">

    <div class="tabs">
      <div class="tab active" onclick="switchTab('login')">로그인</div>
      <div class="tab" onclick="switchTab('register')">회원가입</div>
      <div class="tab" onclick="switchTab('find')">계정 찾기</div>
    </div>

    <!-- 로그인 -->
    <div class="form-section active" id="tab-login">
      <div id="login-alert" class="alert"></div>
      <div class="form-group">
        <label>아이디 / 이메일</label>
        <input type="text" placeholder="아이디 또는 이메일을 입력하세요" id="login-id">
      </div>
      <div class="form-group">
        <label>비밀번호</label>
        <input type="password" placeholder="비밀번호를 입력하세요" id="login-pw">
      </div>
      <button class="btn-submit" onclick="doLogin()">로그인</button>
      <div class="find-links">
        <a onclick="switchTab('find')">아이디 찾기</a>
        <a onclick="switchTab('find')">비밀번호 찾기</a>
      </div>
      <div class="form-footer">
        아직 회원이 아니신가요?
        <a onclick="switchTab('register')">회원가입</a>
      </div>
    </div>

    <!-- 회원가입 -->
    <!-- 가입 정보는 WordPress DB(wp_users 테이블)에 저장됨 -->
    <div class="form-section" id="tab-register">
      <div id="reg-alert" class="alert"></div>
      <div class="form-group">
        <label>아이디</label>
        <input type="text" placeholder="아이디를 입력하세요" id="reg-id">
      </div>
      <div class="form-group">
        <label>이메일</label>
        <input type="email" placeholder="이메일을 입력하세요" id="reg-email">
      </div>
      <div class="form-group">
        <label>비밀번호</label>
        <input type="password" placeholder="비밀번호를 입력하세요 (6자 이상)" id="reg-pw">
      </div>
      <div class="form-group">
        <label>비밀번호 확인</label>
        <input type="password" placeholder="비밀번호를 다시 입력하세요" id="reg-pw2">
      </div>
      <button class="btn-submit" onclick="doRegister()">회원가입</button>
      <div class="form-footer">
        이미 회원이신가요?
        <a onclick="switchTab('login')">로그인</a>
      </div>
    </div>

    <!-- 계정 찾기 -->
    <div class="form-section" id="tab-find">
      <div id="find-alert" class="alert"></div>
      <p class="msg">가입 시 등록한 이메일로<br>계정 정보를 보내드립니다.</p>
      <div class="form-group">
        <label>이메일</label>
        <input type="email" placeholder="가입한 이메일을 입력하세요" id="find-email">
      </div>
      <button class="btn-submit" onclick="doFind()">계정 찾기</button>
      <div class="form-footer">
        <a onclick="switchTab('login')">로그인으로 돌아가기</a>
      </div>
    </div>

  </div>
</div>

<script src="/login.js"></script>
</body>
</html>
